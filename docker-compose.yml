services:
 db:
  image: postgres:16-alpine
  environment: {POSTGRES_DB: shop, POSTGRES_USER: shop, POSTGRES_PASSWORD: shop}
  volumes: [shop-data:/var/lib/postgresql/data]
  healthcheck: {test: [CMD-SHELL, pg_isready -U shop -d shop], interval: 5s, retries: 10}
 api:
  build: ./backend
  environment: {DATABASE_URL: postgresql://shop:shop@db:5432/shop, APP_VERSION: local}
  depends_on: {db: {condition: service_healthy}}
  ports: ['8000:8000']
 frontend:
  image: nginx:1.27-alpine
  volumes: ['./frontend:/usr/share/nginx/html:ro','./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
  depends_on: [api]
  ports: ['8080:80']
volumes: {shop-data: {}}
