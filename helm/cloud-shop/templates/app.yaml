apiVersion: v1
kind: Namespace
metadata: {name: ecommerce}
---
apiVersion: v1
kind: Secret
metadata: {name: shop-secrets,namespace: ecommerce}
type: Opaque
stringData: {POSTGRES_PASSWORD: {{ .Values.postgresPassword | quote }}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-api,namespace: ecommerce}
spec:
 replicas: {{ .Values.apiReplicas }}
 selector: {matchLabels: {app: shop-api}}
 template:
  metadata: {labels: {app: shop-api}}
  spec:
   containers:
   - {name: api,image: {{ .Values.apiImage }},ports: [{containerPort: 8000}]}
---
apiVersion: v1
kind: Service
metadata: {name: shop-api,namespace: ecommerce}
spec: {selector: {app: shop-api},ports: [{port: 8000}]}
